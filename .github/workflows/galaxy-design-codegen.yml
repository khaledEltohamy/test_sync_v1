name: Galaxy - Generate Design System

on:
  push:
    paths:
      - token_pipeline/token.json
      - token_pipeline/tokens/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-design-system:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable

      - name: Create design_codegen runner
        run: |
          mkdir -p .galaxy/design_codegen_runner

          cat > .galaxy/design_codegen_runner/pubspec.yaml <<'EOF'
          name: galaxy_design_codegen_runner
          publish_to: none

          environment:
            sdk: ">=3.10.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            design_codegen: ^0.0.3
          EOF

      - name: Install design_codegen
        working-directory: .galaxy/design_codegen_runner
        run: |
          flutter pub get

      - name: Resolve design_codegen package
        id: codegen
        working-directory: .galaxy/design_codegen_runner
        run: |
          CODEGEN_ROOT=$(dart -e '
          import "dart:convert";
          import "dart:io";

          final config = File(".dart_tool/package_config.json");
          final document = jsonDecode(config.readAsStringSync());

          final package = (document["packages"] as List)
              .cast<Map<String, dynamic>>()
              .firstWhere(
                (package) => package["name"] == "design_codegen",
              );

          final rootUri = Uri.parse(package["rootUri"] as String);

          print(
            Directory.fromUri(
              config.absolute.uri.resolveUri(rootUri),
            ).resolveSymbolicLinksSync(),
          );
          ')

          echo "CODEGEN_ROOT=$CODEGEN_ROOT" >> "$GITHUB_OUTPUT"

          echo "Resolved design_codegen:"
          echo "$CODEGEN_ROOT"

      - name: Generate Atomic Design System and Pages
        run: |
          CODEGEN_ROOT="${{ steps.codegen.outputs.CODEGEN_ROOT }}"

          echo "Using design_codegen from:"
          echo "$CODEGEN_ROOT"

          cd "$CODEGEN_ROOT"

          dart pub get

          dart bin/generate_design_system.dart \
            "$GITHUB_WORKSPACE/token_pipeline/token.json" \
            "$GITHUB_WORKSPACE/packages/design_system/lib" \
            "$GITHUB_WORKSPACE/apps/example_project_name/lib/generated/pages"

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add packages/design_system

          if [ -d "$GITHUB_WORKSPACE/apps/example_project_name/lib/generated/pages" ]; then
            git add "$GITHUB_WORKSPACE/apps/example_project_name/lib/generated/pages"
          fi

          if [ -d "$GITHUB_WORKSPACE/apps" ]; then
            git add apps
          fi

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "chore: generate design system and pages"

          git push
