# Generated by Galaxy.
# This workflow uses the public design_codegen package to generate the
# Atomic Design System and Figma pages after Galaxy pushes token.json.

name: Galaxy - Generate Design System

on:
  push:
    paths:
      - token_pipeline/token.json
      - token_pipeline/tokens/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-design-system:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare design_codegen runner
        run: |
          mkdir -p .galaxy/design_codegen_runner
          cat > .galaxy/design_codegen_runner/pubspec.yaml <<'EOF'
          name: galaxy_design_codegen_runner
          publish_to: none

          environment:
            sdk: ">=3.10.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            design_codegen: ^0.0.1
          EOF

      - name: Install design_codegen
        working-directory: .galaxy/design_codegen_runner
        run: flutter pub get

      - name: Resolve design_codegen package
        working-directory: .galaxy/design_codegen_runner
        id: codegen
        shell: bash
        run: |
          CODEGEN_ROOT=$(python3 - <<'PYCODE'
          import json
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          config = Path('.dart_tool/package_config.json').resolve()
          data = json.loads(config.read_text())

          for package in data['packages']:
              if package['name'] == 'design_codegen':
                  uri = package['rootUri']
                  parsed = urlparse(uri)
                  if parsed.scheme == 'file':
                      print(unquote(parsed.path))
                  else:
                      print((config.parent / uri).resolve())
                  break
          else:
              raise SystemExit('design_codegen package was not resolved')
          PYCODE
          )

          echo "CODEGEN_ROOT=$CODEGEN_ROOT" >> "$GITHUB_OUTPUT"

      - name: Generate Atomic Design System and Pages
        run: |
          dart "${{ steps.codegen.outputs.CODEGEN_ROOT }}"             "$GITHUB_WORKSPACE/token_pipeline/token.json"             "$GITHUB_WORKSPACE/packages/design_system/lib"             "$GITHUB_WORKSPACE/apps/example_project_name/lib/generated/pages"

      - name: Commit generated Design System and Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add packages/design_system "apps/example_project_name/lib/generated/pages"

          if git diff --cached --quiet; then
            echo "No Design System or page changes."
            exit 0
          fi

          git commit -m "chore: generate design system and pages"
          git push
