# GENERATED BY GALAXY
name: Galaxy Design Codegen

on:
  push:
    paths-ignore:
      - "packages/design_system/lib/**"
      - "apps/example_project_name/lib/src/modules/**"
      - "apps/example_project_name/lib/generated/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galaxy-design-codegen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Generate design system and pages
        run: bash scripts/generate_design.sh

      - name: Commit generated files
        run: |
          git config user.name "galaxy-bot"
          git config user.email "galaxy-bot@users.noreply.github.com"

          # Generation can modify:
          # - design system
          # - generated modules/pages
          # - generated routes
          # - assets
          # - assets_path.dart
          # - pubspec/lock files

          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "chore: regenerate design system and pages [skip ci]"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
